<ion-header>
  <ion-toolbar>
    <ion-title>Pedidos</ion-title>

    <ion-buttons slot="start">
      <!-- Flecha back; si no hay historial, vuelve a /catalog -->
      <ion-back-button text="" defaultHref="/catalog" aria-label="Regresar"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button [routerLink]="['/catalog']">Catálogo</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list>
    <ion-item *ngFor="let o of orders" detail="true">
      <ion-icon slot="start" name="receipt-outline"></ion-icon>
      <ion-label>
        <div class="row">
          <strong>#{{ o.id }}</strong>
          <ion-chip [color]="color(o.status)" [outline]="true">{{ o.status }}</ion-chip>

        </div>
        <div class="sub">
          {{ o.date | date:'dd/MM/yyyy, h:mm a' }} • {{ o.items }} artículos
        </div>
      </ion-label>
      <ion-badge slot="end" color="primary">${{ o.total | number:'1.2-2' }}</ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
